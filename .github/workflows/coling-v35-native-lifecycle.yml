name: COLING v35 controlled native multi-cycle read-write lifecycle
on:
  push:
    branches:
      - experiments/coling-v35-native-lifecycle-20261011
    paths:
      - .github/workflows/coling-v35-native-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official framework, numpy and cryptography
        run: |
          python -m pip install 'langchain-core==0.3.83' 'numpy>=1.26,<3' 'cryptography>=42'
          python -c 'from importlib.metadata import version; assert version("langchain-core")=="0.3.83"'
      - name: Pin and verify untouched upstream retriever source
        run: |
          mkdir -p src
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/langchain-ai/langchain/bdf1cd383ce36dc18381a3bf3fb0a579337a32b5/libs/langchain/langchain/retrievers/time_weighted_retriever.py -o src/time_weighted_retriever_v29.py
          echo '2a55ff628c1d44ebf1faa01008579ac26ed0ae5996daec6dcde3ae4cb9233daa  src/time_weighted_retriever_v29.py' | sha256sum --check
      - name: Execute 8 independent CUT-WRITE-READ-WRITE-READ native cycles
        run: |
          python - <<'PY'
          import datetime as dt, json, base64, hashlib, zlib, os
          from pathlib import Path
          from unittest.mock import patch
          from importlib.metadata import version
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey,Ed25519PublicKey
          from cryptography.hazmat.primitives.serialization import Encoding,PublicFormat
          from experiments import locomo_readside_v29 as v
          assert version('langchain-core')=='0.3.83'
          m=v.load_upstream(Path('src/time_weighted_retriever_v29.py'))
          base=dt.datetime(2026,10,10,12,0)
          topics=['paris museums tickets','berlin summer rail','tokyo gardens map','seoul cafes itinerary','rome ancient ruins','london theatre seats','madrid cycling tours','oslo harbor ferry']
          queries=['paris museum tickets advice','tokyo gardens and map','berlin summer rail','rome ancient ruins','seoul cafes','london theatre','madrid cycling','oslo harbor']
          ids=[f'm{i}' for i in range(8)]
          docs=[v.Document(page_content=t,metadata={'item_id':ids[i],'importance':round(.06+.05*(i%5),3),'last_accessed_at':base-dt.timedelta(hours=2+i)}) for i,t in enumerate(topics)]
          ret=v.create_retriever(m,docs,search_k=8,k=2)
          sk=Ed25519PrivateKey.from_private_bytes(hashlib.sha256(b'V35-PUBLIC-TEST-KEY-NOT-SECRET').digest())
          pk=base64.b64encode(sk.public_key().public_bytes(Encoding.Raw,PublicFormat.Raw)).decode()
          def canonical(x):return json.dumps(x,sort_keys=True,separators=(',',':')).encode()
          def sign(obj):return canonical({'payload':obj,'signature':base64.b64encode(sk.sign(canonical(obj))).decode()})+b'\n'
          def state():return {d.metadata['item_id']:{f:v.iso(d.metadata[f]) if isinstance(d.metadata[f],dt.datetime) else float(d.metadata[f]) for f in ('importance','last_accessed_at')} for d in ret.memory_stream}
          def flat(s):return {i+'.'+k:v for i,d in s.items() for k,v in d.items()}
          pub=Path('v35-evidence/public');priv=Path('v35-evidence/private');pub.mkdir(parents=True);priv.mkdir()
          common=[];before_events=[];cuts=[];checks=[];changed_reads=0
          entries={'none':[],'hot3':[],'hot5':[],'full_undo':[],'full_snapshot':[]}
          for epoch in range(8):
            t=base+dt.timedelta(hours=3*epoch)
            cut=state();cuts.append({'epoch':epoch,'when':v.iso(t),'state':cut})
            entries['full_snapshot'].append(sign({'policy':'full_snapshot','epoch':epoch,'state':cut}))
            common.append({'kind':'CUT','epoch':epoch,'when':v.iso(t),'candidate_ids':ids})
            def write(i,tag):
              doc=next(d for d in ret.memory_stream if d.metadata['item_id']==i)
              old=float(doc.metadata['importance'])
              new=round(.05+.13*((3*epoch+(0 if tag=='1' else 5))%7),3)
              if old==new:new=round((new+.031)%1,3)
              doc.metadata['importance']=new
              eid=f'e{epoch}-{tag}-W';key=i+'.importance'
              before_events.append({'event':eid,'epoch':epoch,'key':key,'old':old})
              common.append({'kind':'WRITE','epoch':epoch,'event':eid,'key':key,'new':new})
            def read(q,tag,when):
              nonlocal_dummy=None
              pre=flat(state())
              relevance={d.metadata['item_id']:float(s) for d,s in ret.vectorstore.similarity_search_with_relevance_scores(q,k=8)}
              assert len(relevance)==8
              expected=sorted(ids,key=lambda i:(-((.99)**((when-dt.datetime.fromisoformat(cut[i]['last_accessed_at'])).total_seconds()/3600)+float(cut[i]['importance'])+relevance[i]),i))[:2]
              class Clock(dt.datetime):
                @classmethod
                def now(cls,tz=None):return when
              with patch.object(m.datetime,'datetime',Clock):
                selected=[d.metadata['item_id'] for d in ret.invoke(q)]
              after=flat(state());changed=[k for k in sorted(after) if after[k]!=pre[k]]
              assert len(changed)==2 and all(k.endswith('.last_accessed_at') for k in changed)
              assert set(selected)=={k.split('.')[0] for k in changed}
              eid=f'e{epoch}-{tag}-R'
              for key in changed:before_events.append({'event':eid,'epoch':epoch,'key':key,'old':pre[key]})
              common.append({'kind':'READ_COMMIT','epoch':epoch,'event':eid,'time':v.iso(when),'query':q,'selected':selected,'changed_keys':changed,'post':{k:after[k] for k in changed}})
              checks.append({'epoch':epoch,'event':eid,'query':q,'time':v.iso(when),'selected':selected,'cut_reference':expected,'oracle_label':'ACCEPT' if set(selected)==set(expected) else 'REJECT','relevance':relevance})
            write(ids[epoch%8],'1')
            read(queries[epoch%8],'1',t+dt.timedelta(minutes=1))
            write(ids[(epoch+3)%8],'2')
            read(queries[(epoch+3)%8],'2',t+dt.timedelta(minutes=2))
            for policy,keep in [('none',set()),('hot3',set(ids[:3])),('hot5',set(ids[:5])),('full_undo',set(ids))]:
              vals=[x for x in before_events if x['epoch']==epoch and x['key'].split('.')[0] in keep]
              if vals:entries[policy].append(sign({'policy':policy,'epoch':epoch,'entries':vals}))
          public_events=b''.join(sign(dict(seq=i,**e)) for i,e in enumerate(common))
          (pub/'events-signed.jsonl').write_bytes(public_events)
          (pub/'catalog.json').write_bytes(canonical({'ids':ids,'texts':topics,'k':2,'decay_rate':.01,'clock':'prespecified deterministic test times','no_public_old_value_commitment':True}))
          (pub/'final-state.json').write_bytes(canonical(state()))
          (pub/'registered-public-key.txt').write_text(pk)
          raw_cost={}
          for policy,lines in entries.items():
            raw=b''.join(lines)
            (pub/(policy+'-retention.jsonl')).write_bytes(raw)
            raw_cost[policy]={'signed_bytes':len(raw),'compressed_signed_bytes':len(zlib.compress(raw,9)) if raw else 0,'receipt_count':len(lines)}
          (priv/'truth.json').write_bytes(canonical({'cuts':cuts,'tests':checks,'source_sha256':v.UPSTREAM_SHA}))
          report={'native_invokes':len(checks),'read_metadata_refreshes':len(checks)*2,'external_importance_writes':16,'cuts':len(cuts),'signed_public_events':len(common),'signed_common_bytes':len(public_events),'signed_retention_costs':raw_cost,'observed_cut_labels':{l:sum(x['oracle_label']==l for x in checks) for l in ('ACCEPT','REJECT')},'note':'Controlled serial in-memory fixture; ephemeral pre-read snapshots, no durable atomic logging or deployed lifecycle.'}
          (pub/'native-summary.json').write_bytes(canonical(report))
          assert len(checks)==16 and len(common)==40 and len(before_events)==48
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          verify=Ed25519PublicKey.from_public_bytes(base64.b64decode(pk))
          for line in public_events.splitlines():
            e=json.loads(line);verify.verify(base64.b64decode(e['signature']),canonical(e['payload']))
          print('NATIVE_V35_SUCCESS',json.dumps(report,sort_keys=True))
          PY
      - name: Independent P-only certificate checks and private oracle grading
        run: |
          mkdir only-public-v35
          cp -a v35-evidence/public/. only-public-v35/
          python - <<'PY'
          import json,base64,datetime as dt,hashlib,math,zlib
          from pathlib import Path
          import numpy as np
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from experiments import locomo_readside_v29 as v
          P=Path('only-public-v35')
          def load(p):return json.loads(p.read_text())
          public_key=base64.b64decode((P/'registered-public-key.txt').read_text())
          vk=Ed25519PublicKey.from_public_bytes(public_key)
          def verify_bytes(p):
            out=[]
            for line in p.read_bytes().splitlines():
              o=json.loads(line)
              vk.verify(base64.b64decode(o['signature']),json.dumps(o['payload'],sort_keys=True,separators=(',',':')).encode())
              out.append(o['payload'])
            return out
          signed=verify_bytes(P/'events-signed.jsonl')
          assert [x['seq'] for x in signed]==list(range(len(signed)))
          events=[{k:v for k,v in x.items() if k!='seq'} for x in signed]
          assert len(events)==40 and sum(x['kind']=='READ_COMMIT' for x in events)==16
          final=load(P/'final-state.json')
          flat={i+'.'+k:v for i,fields in final.items() for k,v in fields.items()}
          cat=load(P/'catalog.json')
          ids=cat['ids']; topics=cat['texts']
          assert len(ids)==8 and len(topics)==8
          assert not (P/'private').exists() and not (P/'truth.json').exists()
          base=dt.datetime(2026,10,10,12,0)
          rows=[]
          for policy in ['none','hot3','hot5','full_undo','full_snapshot']:
            rcpts=verify_bytes(P/(policy+'-retention.jsonl'))
            witness={}
            for r in rcpts:
              if policy=='full_snapshot':continue
              for e in r['entries']:
                pair=(e['event'],e['key'])
                assert pair not in witness
                assert policy=='full_undo' or e['key'].split('.')[0] in {'none':set(),'hot3':set(ids[:3]),'hot5':set(ids[:5])}[policy]
                witness[pair]=e['old']
            snapshots={r['epoch']:{i+'.'+k:v for i,fields in r['state'].items() for k,v in fields.items()} for r in rcpts} if policy=='full_snapshot' else {}
            for epoch in range(8):
              cutindex=next(i for i,e in enumerate(events) if e['kind']=='CUT' and e['epoch']==epoch)
              first={}
              if policy!='full_snapshot':
                for e in events[cutindex+1:]:
                  if e['kind']=='WRITE':first.setdefault(e['key'],(e['event'],e['key']))
                  elif e['kind']=='READ_COMMIT':
                    for k in e['changed_keys']:first.setdefault(k,(e['event'],k))
                known={k:(witness.get(first[k]) if k in first else finalval) for k,finalval in flat.items()}
              else:known=snapshots[epoch]
              for e in events[cutindex+1:]:
                if e['kind']!='READ_COMMIT' or e['epoch']!=epoch:continue
                when=dt.datetime.fromisoformat(e['time'])
                cut_when=dt.datetime.fromisoformat(events[cutindex]['when'])
                q=np.asarray(v.vec(e['query']))
                rel={ids[i]:float(np.dot(q,np.asarray(v.vec(topics[i])))) for i in range(len(ids))}
                lo={};hi={}
                for id in ids:
                  imp=known.get(id+'.importance')
                  at=known.get(id+'.last_accessed_at')
                  a,b=(0.,1.) if imp is None else (float(imp),float(imp))
                  if at is None:
                    age=(when-(base-dt.timedelta(hours=20))).total_seconds()/3600
                    c,d=.99**age,.99**((when-cut_when).total_seconds()/3600)
                  else:
                    c=d=.99**((when-dt.datetime.fromisoformat(at)).total_seconds()/3600)
                  lo[id]=a+c+rel[id];hi[id]=b+d+rel[id]
                sel=set(e['selected']);rest=set(ids)-sel
                if min(lo[i] for i in sel)>max(hi[j] for j in rest)+1e-9:label='ACCEPT'
                elif any(lo[j]>hi[i]+1e-9 for j in rest for i in sel):label='REJECT'
                else:label='UNVERIFIABLE'
                rows.append({'policy':policy,'epoch':epoch,'read_id':e['event'],'verdict':label})
          (P/'audit-verdicts.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          truth=load(Path('v35-evidence/private/truth.json'))
          gold={(x['epoch'],x['event']):x['oracle_label'] for x in truth['tests']}
          stats=[]
          for p in ['none','hot3','hot5','full_undo','full_snapshot']:
            r=[x for x in rows if x['policy']==p]
            definite=sum(x['verdict']!='UNVERIFIABLE' for x in r)
            errors=sum(x['verdict']!='UNVERIFIABLE' and x['verdict']!=gold[(x['epoch'],x['read_id'])] for x in r)
            assert errors==0,(p,errors)
            if p in ('full_undo','full_snapshot'):assert definite==16,(p,definite)
            stats.append({'policy':p,'definite':definite,'n':16,'errors':errors,
                          **load(Path('v35-evidence/public/native-summary.json'))['signed_retention_costs'][p]})
          out={'native_verified':True,'fully_isolated_auditor':True,'independent_certificate_checks':len(rows),'policies':stats,
               'caveat':'Small serial in-memory test, not a real deployed lifetime/atomic logger; score bounds conservative.'}
          Path('v35-evidence/public/verified-policy-summary.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          print('V35_POLICY_AUDIT_SUCCESS',json.dumps(out,sort_keys=True))
          PY
      - name: Retain original native execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coling-v35-pinned-native-8-epoch-lifecycle
          path: |
            v35-evidence/
            .github/workflows/coling-v35-native-lifecycle.yml
            experiments/locomo_readside_v29.py
            src/time_weighted_retriever_v29.py
          if-no-files-found: warn
          retention-days: 90
