name: COLING v30 strict P-observation alias verification
on:
  push:
    branches:
      - experiments/coling-v30-observation-isolation-20261011
    paths:
      - experiments/paired_observation_isolation_v30.py
      - .github/workflows/coling-v30-paired-observation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine LangChain
        run: python -m pip install 'langchain-core==0.3.83' 'numpy>=1.26,<3' 'cryptography>=42'
      - name: Load SHA-pinned official time-weighted implementation
        run: |
          mkdir -p src
          curl -sSfL --retry 3 https://raw.githubusercontent.com/langchain-ai/langchain/bdf1cd383ce36dc18381a3bf3fb0a579337a32b5/libs/langchain/langchain/retrievers/time_weighted_retriever.py -o src/time_weighted_retriever_v29.py
          echo '2a55ff628c1d44ebf1faa01008579ac26ed0ae5996daec6dcde3ae4cb9233daa  src/time_weighted_retriever_v29.py' | sha256sum -c -
      - name: NATIVE original timestamp-refresh reads with before-write signed preimages
        run: python experiments/paired_observation_isolation_v30.py --mode generate --out v30-native
      - name: Auditor ONLY reads each public observer view
        run: |
          python experiments/paired_observation_isolation_v30.py --mode audit --out v30-native
      - name: Grade only AFTER public-only audit completed
        run: |
          python experiments/paired_observation_isolation_v30.py --mode evaluate --out v30-native
      - name: Verify public-byte equality and absence of hidden cut history in no-capture view
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('v30-native/isolated_views/no_capture')
          a=p/'world0';b=p/'world1'
          for n in ['public-ledger.jsonl','observed-state.json','catalog.json']:
           assert (a/n).read_bytes()==(b/n).read_bytes(),n
           assert b'PRIVATE_CUT_TRUTH' not in (a/n).read_bytes()
          assert not (a/'capture-C-last-access.jsonl').exists() and not (b/'capture-C-last-access.jsonl').exists()
          x=json.loads(pathlib.Path('v30-native/evaluation-only-summary.json').read_text())
          assert x['no_capture_abstentions']==2 and x['incorrect_definite_verdicts']==0
          print('PASS: byte-identical signed public histories; private preimages segregated; 2/2 abstain without capture')
          PY
      - name: Upload raw code and signed/isolated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coling-v30-isolated-native-observation
          path: |
            experiments/paired_observation_isolation_v30.py
            src/time_weighted_retriever_v29.py
            v30-native/
          retention-days: 90
