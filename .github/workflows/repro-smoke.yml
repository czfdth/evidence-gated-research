name: repro-smoke

on:
  workflow_dispatch:
    inputs:
      paper_repository:
        description: Private paper repository to check
        required: true
        default: your-org/your-paper
      paper_ref:
        description: Paper branch, tag, or commit
        required: true
        default: master
      bundle:
        description: Existing repro bundle directory relative to the paper checkout
        required: true
        default: submission/repro

permissions:
  contents: read

jobs:
  repro-smoke:
    name: clean checkout repro smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout private paper
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.paper_repository }}
          ref: ${{ inputs.paper_ref }}
          path: _paper
          token: ${{ secrets.PAPER_REPOSITORY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install tool dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.lock

      - name: Verify repro bundle
        shell: pwsh
        run: |
          $env:PYTHONPATH = "tools"
          $bundle = Join-Path "_paper" "${{ inputs.bundle }}"
          python -m ccfa.repro_package verify --bundle $bundle
