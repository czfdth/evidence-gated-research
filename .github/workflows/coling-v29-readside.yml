name: COLING v29 pinned time-weighted read side and evidence-aligned LoCoMo
on:
  push:
    branches:
      - experiments/coling-v29-read-side-alias-20261010
    paths:
      - 'experiments/locomo_readside_v29.py'
      - '.github/workflows/coling-v29-readside.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-read-side:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine pinned LangChain and cryptography
        run: |
          python -m pip install 'langchain-core==0.3.83' 'numpy>=1.26,<3' 'cryptography>=42'
          python -c 'from importlib.metadata import version; assert version("langchain-core")=="0.3.83"'
      - name: Retrieve byte-exact pinned official time-weighted source
        run: |
          mkdir -p src
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/langchain-ai/langchain/bdf1cd383ce36dc18381a3bf3fb0a579337a32b5/libs/langchain/langchain/retrievers/time_weighted_retriever.py -o src/time_weighted_retriever_v29.py
          echo '2a55ff628c1d44ebf1faa01008579ac26ed0ae5996daec6dcde3ae4cb9233daa  src/time_weighted_retriever_v29.py' | sha256sum --check
      - name: Native read-side refresh paired-alias and full-conversation natural queries
        run: python experiments/locomo_readside_v29.py --limit 10 --out v29-evidence
      - name: Validate resulting receipts and non-trivial outcomes
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('v29-evidence')
          a=json.loads((p/'paired-alias/paired-alias-results.json').read_text())
          b=json.loads((p/'natural-aligned-summary.json').read_text())
          assert a['observation_identical_after_rollback'] and a['cut_relative_labels_opposed']
          assert b['native_read_calls']>0 and b['actual_access_time_mutations']>=b['native_read_calls']
          assert b['total_supported_queries']>23
          print('VERIFIED', b['total_supported_queries'], 'natural queries',b['actual_access_time_mutations'],'genuine timestamp updates')
          PY
      - name: Remove raw dataset even on failure
        if: always()
        run: |
          rm -f v29-evidence/locomo10.json
      - name: Publish raw signed receipts and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coling-v29-pinned-readside-native-evidence
          path: |
            v29-evidence/
            src/time_weighted_retriever_v29.py
            experiments/locomo_readside_v29.py
          retention-days: 90
          if-no-files-found: error
