name: reference-audit

on:
  schedule:
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-drift:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install registry dependency
        run: python -m pip install PyYAML==6.0.1

      - name: Check pinned upstream references
        env:
          PYTHONPATH: tools
        run: python -m ccfa.reference_audit check --strict
