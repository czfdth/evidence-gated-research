<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect x="0" y="0" width="1280" height="800" fill="#f7f7f8"/>
  <g id="toolbar">
    <rect x="0" y="0" width="1280" height="40" rx="0" fill="#ffffff"/>
    <line x1="0" y1="40" x2="1280" y2="40" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="10" y="6" width="72" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="30" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">刷新</text>
    <rect x="90" y="6" width="60" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="104" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">设置</text>
    <text x="1268" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">1 个 ready · 3 项待人工</text>
  </g>
  <g id="project-list">
    <rect x="8" y="48" width="220" height="720" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="20" y="72" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">项目</text>
    <rect x="16" y="82" width="204" height="28" rx="4" fill="#e8f0fe"/>
    <text x="24" y="101" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">● example-paper</text>
    <rect x="16" y="114" width="204" height="28" rx="4" fill="none"/>
    <text x="24" y="133" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">● shadowmem-extension</text>
  </g>
  <g id="human-checkpoints">
    <rect x="236" y="48" width="608" height="72" rx="6" fill="#fffaeb" stroke="#fedf89" stroke-width="1"/>
    <text x="250" y="76" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="start">ready=false：3 项人工复核未完成，其中 1 项阻塞投稿</text>
    <text x="250" y="98" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">脚本只能证明它还没被回答，不能替你回答。</text>
    <rect x="236" y="132" width="608" height="100" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="250" y="146" width="68.4" height="20" rx="4" fill="#f2f4f7" stroke="#e4e4e7" stroke-width="1"/><text x="284.2" y="160" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#1a1a1f" text-anchor="middle">approve</text>
    <rect x="740" y="144" width="90" height="26" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="785.0" y="161.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">打开台账</text>
    <text x="250" y="186" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="start">主证明逐行成立吗？每一步推理与所依赖的假设是否都站得住？</text>
    <text x="250" y="210" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">data/proof-audit.yaml — 写 reviewer、结论与复核证据路径</text>
    <rect x="236" y="240" width="608" height="100" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="250" y="254" width="68.4" height="20" rx="4" fill="#f2f4f7" stroke="#e4e4e7" stroke-width="1"/><text x="284.2" y="268" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#1a1a1f" text-anchor="middle">approve</text>
    <rect x="740" y="252" width="90" height="26" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="785.0" y="269.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">打开台账</text>
    <text x="250" y="294" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="start">关键引用是否真的支撑它所在的那句论断，而不只是存在？</text>
    <text x="250" y="318" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">data/citation-support.yaml — 逐条写 supports 与判定依据</text>
    <rect x="236" y="348" width="608" height="100" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="250" y="362" width="68.4" height="20" rx="4" fill="#f2f4f7" stroke="#e4e4e7" stroke-width="1"/><text x="284.2" y="376" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#1a1a1f" text-anchor="middle">approve</text>
    <rect x="740" y="360" width="90" height="26" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="785.0" y="377.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">打开台账</text>
    <text x="250" y="402" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="start">每张图和表是否真的展示了正文声称的效应？</text>
    <text x="250" y="426" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">data/figure-support.yaml — 逐图写 figure 与判定依据</text>
    <rect x="236" y="456" width="608" height="100" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="250" y="470" width="75.6" height="20" rx="4" fill="#fffaeb" stroke="#e4e4e7" stroke-width="1"/><text x="287.8" y="484" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="middle">feedback</text>
    <rect x="740" y="468" width="90" height="26" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="785.0" y="485.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">打开台账</text>
    <text x="250" y="510" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="start">第二位人类编码者完成盲法编码了吗？一致率达到预设门槛了吗？</text>
    <text x="250" y="534" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">data/human-coding-report.json — 写 coders、agreement、kappa 与分歧裁决</text>
  </g>
  <g id="chat-panel">
    <rect x="852" y="48" width="420" height="720" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="864" y="72" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">对话</text>
    <text x="864" y="104" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">引擎</text>
    <rect x="1094" y="88" width="166" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="1106" y="106" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">OpenAI 兼容</text>
    <rect x="864" y="128" width="396" height="420" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="864" y="572" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">已连接 deepseek-v4-flash</text>
    <rect x="864" y="582" width="396" height="96" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="876" y="606" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">输入消息，Ctrl+Enter 发送</text>
    <rect x="864" y="726" width="64" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="896.0" y="744.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">发送</text>
  </g>
  <g id="status-bar">
    <rect x="0" y="776" width="1280" height="24" rx="0" fill="#ffffff"/>
    <line x1="0" y1="776" x2="1280" y2="776" stroke="#e4e4e7" stroke-width="1"/>
    <text x="12" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">工作流：默认（仓库根）</text>
    <text x="1268" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#067647" text-anchor="end">凭据可用</text>
  </g>
</svg>
