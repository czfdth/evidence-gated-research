    <text x="40" y="25" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="600" fill="#1a1a1f" text-anchor="start">论文工作台</text>
    <rect x="122" y="6" width="80" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><g transform="translate(131,12.0) scale(0.6666666666666666)" fill="none" stroke="#1a1a1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g><text x="174.5" y="24.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">刷新</text>
    <rect x="210" y="6" width="74" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><g transform="translate(219,12.0) scale(0.6666666666666666)" fill="none" stroke="#1a1a1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></g><text x="259.5" y="24.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">设置</text>
    <rect x="292" y="6" width="36" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><g transform="translate(301,12.0) scale(0.6666666666666666)" fill="none" stroke="#1a1a1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6l-4 4V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></g><text x="322.5" y="24.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle"></text>
    <text x="1268" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">papers/ 下没有项目</text>
  </g>
  <g id="project-list">
