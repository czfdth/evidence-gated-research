    <text x="250" y="80" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="17" font-weight="600" fill="#1a1a1f" text-anchor="start">未选择项目</text>
    <text x="250" y="102" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">从左侧选择一个项目</text>
    <rect x="236" y="152" width="608" height="616" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <g transform="translate(518.0,316) scale(1.8333333333333333)" fill="none" stroke="#c9c9d1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
    <text x="540.0" y="404" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="600" fill="#1a1a1f" text-anchor="middle">还没有论文项目</text>
    <text x="540.0" y="430" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">scripts/new-paper.ps1 my-paper --venue NeurIPS --year 2027 --mode conference</text>
    <text x="540.0" y="452" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">创建第一篇后点「刷新」即可在这里看到它。</text>
  </g>
  <g id="chat-panel">
    <rect x="852" y="48" width="420" height="720" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
