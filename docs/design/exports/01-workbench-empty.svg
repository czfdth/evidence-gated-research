<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect x="0" y="0" width="1280" height="800" fill="#f7f7f8"/>
  <g id="toolbar">
    <rect x="0" y="0" width="1280" height="40" rx="0" fill="#ffffff"/>
    <line x1="0" y1="40" x2="1280" y2="40" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="10" y="6" width="72" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="30" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">刷新</text>
    <rect x="90" y="6" width="60" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="104" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">设置</text>
    <text x="1268" y="24" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="end">papers/ 下没有项目</text>
  </g>
  <g id="project-list">
    <rect x="8" y="48" width="220" height="720" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="20" y="72" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">项目</text>
  </g>
  <g id="detail-empty">
    <rect x="236" y="48" width="608" height="96" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="250" y="80" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="17" font-weight="600" fill="#1a1a1f" text-anchor="start">未选择项目</text>
    <text x="250" y="102" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">从左侧选择一个项目</text>
    <rect x="236" y="152" width="608" height="616" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="250" y="180" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="600" fill="#1a1a1f" text-anchor="start">还没有论文项目</text>
    <text x="250" y="204" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">scripts/new-paper.ps1 my-paper --venue NeurIPS --year 2027 --mode conference</text>
    <text x="250" y="228" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">创建后点「刷新」即可在这里看到它。</text>
  </g>
  <g id="chat-panel">
    <rect x="852" y="48" width="420" height="720" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="864" y="72" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">对话</text>
    <text x="864" y="104" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">引擎</text>
    <rect x="1094" y="88" width="166" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="1106" y="106" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">OpenAI 兼容</text>
    <rect x="864" y="128" width="396" height="420" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="864" y="572" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">未配置 provider：请先在设置中填写 API 配置</text>
    <rect x="864" y="582" width="396" height="96" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="876" y="606" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">输入消息，Ctrl+Enter 发送</text>
    <rect x="864" y="726" width="64" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="896.0" y="744.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">发送</text>
  </g>
  <g id="status-bar">
    <rect x="0" y="776" width="1280" height="24" rx="0" fill="#ffffff"/>
    <line x1="0" y1="776" x2="1280" y2="776" stroke="#e4e4e7" stroke-width="1"/>
    <text x="12" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">工作流：默认（仓库根）</text>
    <text x="1268" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#067647" text-anchor="end">凭据可用</text>
  </g>
</svg>
