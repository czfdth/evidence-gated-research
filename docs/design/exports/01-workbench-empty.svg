    <text x="864" y="104" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">引擎</text>
    <rect x="1094" y="88" width="166" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="1106" y="106" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">OpenAI 兼容</text>
    <rect x="864" y="128" width="396" height="420" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="864" y="572" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">未配置 provider：请先在设置中填写 API 配置</text>
    <rect x="864" y="582" width="396" height="96" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="876" y="606" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">输入消息，Ctrl+Enter 发送</text>
    <rect x="864" y="726" width="74" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><g transform="translate(873,732.0) scale(0.6666666666666666)" fill="none" stroke="#1a1a1f" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></g><text x="913.5" y="744.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">发送</text>
  </g>
  <g id="status-bar">
    <rect x="0" y="776" width="1280" height="24" rx="0" fill="#ffffff"/>
    <line x1="0" y1="776" x2="1280" y2="776" stroke="#e4e4e7" stroke-width="1"/>
    <text x="12" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">工作流：默认（仓库根）</text>
    <text x="1268" y="792" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#067647" text-anchor="end">凭据可用</text>
