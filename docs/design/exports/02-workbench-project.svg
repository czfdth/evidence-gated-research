    <line x1="237" y1="217" x2="843" y2="217" stroke="#e4e4e7" stroke-width="1"/>
    <text x="250" y="208" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">来源</text>
    <text x="326" y="208" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">代码</text>
    <text x="426" y="208" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">消息</text>
