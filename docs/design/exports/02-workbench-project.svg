    <text x="38" y="120" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#d92d20" text-anchor="start">无法解析 ccfa.yaml</text>
    <rect x="16" y="126" width="204" height="28" rx="4" fill="#e8f0fe"/>
    <text x="24" y="145" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">● example-paper</text>
