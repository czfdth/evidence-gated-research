    <rect x="562.0" y="112" width="111.60000000000001" height="20" rx="4" fill="#f2f4f7" stroke="#e4e4e7" stroke-width="1"/><text x="617.8" y="126" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#1a1a1f" text-anchor="middle">截止 2027-02-15</text>
  </g>
  <g id="action-row">
    <rect x="236" y="152" width="104" height="28" rx="6" fill="#625fff" stroke="#625fff" stroke-width="1"/><text x="288.0" y="170.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">运行 validate</text>
    <rect x="348" y="152" width="122" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="409.0" y="170.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">运行 milestones</text>
