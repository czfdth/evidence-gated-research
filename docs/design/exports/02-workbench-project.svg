    <text x="326" y="236" font-family="'JetBrains Mono', Consolas, 'Cascadia Mono', monospace" font-size="11" font-weight="600" fill="#067647" text-anchor="start">OK</text>
    <text x="426" y="236" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">无问题</text>
    <line x1="237" y1="246" x2="843" y2="246" stroke="#eef0f3" stroke-width="1"/>
  </g>
  <g id="chat-panel">
