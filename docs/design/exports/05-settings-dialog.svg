<svg xmlns="http://www.w3.org/2000/svg" width="560" height="533" viewBox="0 0 560 533">
  <rect x="0" y="0" width="560" height="533" fill="#f7f7f8"/>
  <g id="settings-dialog">
    <rect x="0" y="0" width="560" height="533" rx="0" fill="#f7f7f8"/>
    <text x="16" y="32" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="17" font-weight="600" fill="#1a1a1f" text-anchor="start">设置</text>
    <text x="16" y="54" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">API key 只写入系统密钥环，settings.json 里只保存 key 名称。</text>
    <text x="16" y="82" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">模型 provider</text>
  </g>
  <g id="provider-form">
    <text x="16" y="115" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">Provider 名称</text>
    <rect x="150" y="96" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="16" y="151" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">Base URL</text>
    <rect x="150" y="132" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="16" y="187" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">模型</text>
    <rect x="150" y="168" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="16" y="223" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">超时（秒）</text>
    <rect x="150" y="204" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="160" y="223" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">60.00</text>
    <text x="16" y="259" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">API key</text>
    <rect x="150" y="240" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="16" y="295" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">HTTP 工具</text>
    <rect x="150" y="276" width="394" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="160" y="295" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">可选，例如 http-tools.yaml</text>
    <text x="16" y="331" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">密钥状态</text>
    <text x="150" y="331" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="start">未配置</text>
    <rect x="460" y="204" width="84" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="502.0" y="222.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">浏览</text>
  </g>
  <g id="workflow-section">
    <text x="16" y="352" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="600" fill="#71717a" text-anchor="start">工作流</text>
    <text x="16" y="383" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">工作流目录</text>
    <rect x="150" y="364" width="294" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="160" y="383" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">工作流仓库根目录（含 tools/）</text>
    <rect x="460" y="364" width="84" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="502.0" y="382.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">浏览</text>
    <text x="16" y="419" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="start">Python 解释器</text>
    <rect x="150" y="400" width="294" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/>
    <text x="160" y="419" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">留空则用 tools/.venv 里的解释器</text>
    <rect x="460" y="400" width="84" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="502.0" y="418.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">浏览</text>
    <rect x="150" y="444" width="130" height="28" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1"/><text x="215.0" y="462.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">测试工作流连接</text>
    <text x="544" y="509" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="end">取消</text>
  </g>
  <g id="settings-actions">
    <rect x="428" y="491" width="116" height="28" rx="6" fill="#625fff" stroke="#625fff" stroke-width="1"/><text x="486.0" y="509.0" font-family="'Inter', 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">保存</text>
  </g>
</svg>
